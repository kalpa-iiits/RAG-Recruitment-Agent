name: Build and Deploy

on:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on the EC2 instance but does almost nothing, so it's safe on a small box.
  preflight:
    runs-on: self-hosted
    outputs:
      arch: ${{ steps.arch.outputs.arch }}
    steps:
    - name: Check required secrets
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: |
        if [ -z "$JWT_SECRET" ]; then
          echo "::error::JWT_SECRET repository secret is not set."
          exit 1
        fi

    - name: Detect instance CPU architecture
      id: arch
      run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

  # Builds on a GitHub-hosted runner: pip-installing numpy/FAISS/LangChain on the
  # EC2 instance itself ran it out of memory (builds were OOM-killed, exit 137).
  # The runner matches the instance's architecture so the image runs there.
  build:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    env:
      AWS_REGION: ap-southeast-2

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Uncomment to debug which identity the SCP is evaluating
    # - name: Who am I?
    #   run: aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail

        docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
        docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

        docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

    # Keeps storage costs flat: ECR expires everything but the 2 newest images
    # (the one being deployed and the one before it). Re-applying is a no-op.
    - name: Cap ECR to the 2 newest images
      env:
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      run: |
        if ! aws ecr put-lifecycle-policy \
          --repository-name "$ECR_REPOSITORY" \
          --lifecycle-policy-text '{
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the 2 newest images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 2},
              "action": {"type": "expire"}
            }]
          }' > /dev/null; then
          echo "::warning::Could not set the ECR lifecycle policy. Grant ecr:PutLifecyclePolicy to the deploy IAM user."
        fi

  deploy:
    needs: build
    runs-on: self-hosted

    env:
      AWS_REGION: ap-southeast-2
      CONTAINER_NAME: streamlit-container

    steps:
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Ensure swap is enabled
      run: |
        set -euo pipefail

        # Headroom so a memory spike slows the box down instead of OOM-killing it
        if [ -n "$(swapon --noheadings)" ]; then
          echo "Swap already enabled:"; swapon --show
          exit 0
        fi

        FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        if [ "$FREE_GB" -lt 4 ]; then
          echo "::warning::Only ${FREE_GB}G free on /; skipping swap creation."
          exit 0
        fi

        sudo fallocate -l 2G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
        swapon --show

    - name: Ensure Nginx is installed
      run: |
        set -euo pipefail

        # Only touch apt if Nginx is missing (avoids slow/flaky apt on every deploy)
        if ! command -v nginx &> /dev/null; then
          echo "Installing Nginx..."
          sudo apt-get update
          sudo apt-get install -y nginx
        fi

        sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled

    - name: Deploy container (with rollback)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: |
        set -euo pipefail

        NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        OLD_NAME="${CONTAINER_NAME}-old"

        # Clean up any leftover backup from a previous failed run
        docker rm -f "$OLD_NAME" 2>/dev/null || true

        # Keep the current container as a rollback target instead of deleting it
        HAD_OLD=false
        if docker ps -a --format '{{.Names}}' | grep -qx "$CONTAINER_NAME"; then
          docker stop "$CONTAINER_NAME" >/dev/null
          docker rename "$CONTAINER_NAME" "$OLD_NAME"
          docker update --restart=no "$OLD_NAME" >/dev/null
          HAD_OLD=true
        fi

        # Bind to localhost only, so traffic must go through Nginx
        docker run -d \
          --name "$CONTAINER_NAME" \
          -p 127.0.0.1:8501:8501 \
          --restart always \
          --env-file /opt/cvexpert/.env \
          -e JWT_SECRET \
          -v resume-agent-data:/app/data \
          "$NEW_IMAGE"

        # Health check (FastAPI exposes /health)
        echo "Waiting for the new container to become healthy..."
        HEALTHY=false
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8501/health >/dev/null 2>&1; then
            HEALTHY=true
            break
          fi
          sleep 2
        done

        if [ "$HEALTHY" != "true" ]; then
          echo "::error::New container failed health check. Rolling back."
          docker logs --tail 50 "$CONTAINER_NAME" || true
          docker rm -f "$CONTAINER_NAME" || true
          if [ "$HAD_OLD" = "true" ]; then
            docker rename "$OLD_NAME" "$CONTAINER_NAME"
            docker update --restart=always "$CONTAINER_NAME" >/dev/null
            docker start "$CONTAINER_NAME"
            echo "Rolled back to the previous container."
          fi
          exit 1
        fi

        # Healthy: remove the backup
        docker rm -f "$OLD_NAME" 2>/dev/null || true
        echo "Deployed $NEW_IMAGE"

    - name: Configure Nginx
      run: |
        set -euo pipefail

        CONF=/etc/nginx/sites-available/streamlit

        # Once Certbot has added HTTPS to the config, leave it alone
        if sudo grep -q "ssl_certificate" "$CONF" 2>/dev/null; then
          echo "HTTPS config already present; not overwriting $CONF"
        else
        sudo tee "$CONF" > /dev/null << 'EOL'
        server {
            listen 80;
            server_name api.cvexpert.in;

            location / {
                proxy_pass http://127.0.0.1:8501;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 86400;
            }
        }
        EOL
        fi

        sudo ln -sf /etc/nginx/sites-available/streamlit /etc/nginx/sites-enabled/streamlit
        sudo rm -f /etc/nginx/sites-enabled/default

        sudo nginx -t
        sudo systemctl enable nginx
        sudo systemctl reload nginx || sudo systemctl restart nginx

    # Every image is in ECR, so nothing local is worth keeping except what's
    # running. Also clears build cache left over from when builds ran here.
    - name: Prune old images
      if: success()
      run: |
        docker image prune -af
        docker builder prune -af
        df -h /